<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Diya — My Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bl:#FFF5F8;--pw:#F9E2EB;--ro:#F3C4D5;--rs:#DFA0BA;--rg:#C68B9F;--gold:#C6A16B;--iv:#FFFDF9;--bur:#5c1a33;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--script:'Great Vibes','Snell Roundhand',cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a0f1f;font-family:var(--sans);color:var(--bur);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#layer{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.stage{position:fixed;inset:0;z-index:1;opacity:0;visibility:hidden;transition:opacity 1.4s ease,visibility 1.4s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));overflow:hidden}
.stage.on{opacity:1;visibility:visible}
.serif{font-family:var(--serif)}.script{font-family:var(--script)}
.cta{margin-top:30px;padding:15px 34px;min-height:48px;border-radius:99px;background:linear-gradient(135deg,#fff,var(--pw));border:1px solid var(--gold);color:var(--bur);font-family:var(--serif);font-size:1.25rem;letter-spacing:.04em;box-shadow:0 10px 30px -10px rgba(198,139,159,.7);transition:transform .3s,box-shadow .3s}
.cta:active{transform:scale(.96)}
.cta[hidden]{display:none}
.fadein{animation:fi 1.6s both}@keyframes fi{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
/* S1 */
#s1{background:linear-gradient(180deg,#f0a9c5 0%,#f8cfdd 50%,#fff1f5 100%)}
.castle{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;z-index:-1}
#s1 small{font-family:var(--sans);letter-spacing:.38em;font-size:.72rem;color:var(--bur);opacity:.8}
#s1 h1{font-family:var(--serif);font-weight:600;font-size:clamp(3.4rem,17vw,7rem);line-height:1;margin:14px 0 10px;background:linear-gradient(180deg,#8a3354,#c6a16b 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
#s1 .sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,5.5vw,1.9rem)}
#s1 .msg{margin-top:22px;max-width:30ch;font-size:1rem;line-height:1.6;background:rgba(255,253,249,.55);backdrop-filter:blur(6px);border:1px solid rgba(198,161,107,.6);padding:14px 18px;border-radius:18px}
/* S2 */
#s2{background:radial-gradient(circle at 50% 45%,#ffe9f1,#f3b9d0 70%);transition:background 2s,opacity 1.4s,visibility 1.4s}
#s2.garden{background:linear-gradient(180deg,#f9d3e1,#f1a9c6 60%,#e58fb3)}
.crown{width:min(66vw,290px);cursor:pointer;animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(150,70,100,.45));transition:transform .4s,filter .8s,opacity 1s;touch-action:manipulation;background:none}
.crown:hover{transform:scale(1.06) rotate(-2deg)}
.crown.glow{filter:drop-shadow(0 0 40px #fff) drop-shadow(0 0 90px #ffd98a);transform:scale(1.25);animation:none}
.crown.gone{opacity:0;transform:scale(1.6)}
@keyframes float{50%{transform:translateY(-16px) rotate(1.5deg)}}
.hint{margin-top:26px;font-family:var(--serif);font-style:italic;font-size:1.15rem;opacity:.85;animation:pulse 2.6s infinite}
@keyframes pulse{50%{opacity:.4}}
#wave{position:fixed;left:50%;top:45%;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,236,190,.9) 40%,transparent 70%);transform:scale(0);opacity:0;z-index:15;pointer-events:none}
#wave.go{animation:wave 1.7s ease-out forwards}@keyframes wave{0%{transform:scale(0);opacity:1}100%{transform:scale(60);opacity:0}}
#tmsg{position:absolute;max-width:20ch;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(2rem,9vw,3.2rem);line-height:1.2;color:#fff;text-shadow:0 2px 20px rgba(140,40,80,.55);opacity:0}
#tmsg.show{animation:fi 2.2s .3s both}
.petal{position:absolute;top:-30px;width:16px;height:20px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#fbd5e3,#e48cb0);animation:fall linear forwards;opacity:.9}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.rise{position:absolute;bottom:-30px;animation:rise linear forwards;color:#f08ab0}
@keyframes rise{to{transform:translate(var(--dx),-115vh);opacity:0}}
.bf{position:absolute;width:30px;height:24px;animation:rise linear forwards}
.bf svg{animation:flap .35s infinite alternate;transform-origin:center;width:100%;height:100%}@keyframes flap{to{transform:scaleX(.45)}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe2a0;box-shadow:0 0 10px 3px #ffd36b;animation:sp 1.6s ease-out forwards}
@keyframes sp{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
/* S3 */
#s3{background:linear-gradient(180deg,#f7c4d8 0%,#fbe0ea 55%,#ffeef3 100%);justify-content:flex-start;padding-top:calc(34px + env(safe-area-inset-top))}
.palace{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:-1;opacity:0;transition:opacity 3s}
#s3.on .palace{opacity:1}
#rcrown{width:min(40vw,170px);transform:translateY(-70vh);opacity:0;filter:drop-shadow(0 10px 14px rgba(120,60,80,.4))}
#s3.on #rcrown{animation:desc 2.6s 1s cubic-bezier(.2,.8,.25,1) forwards}@keyframes desc{to{transform:none;opacity:1}}
.bloom{position:relative;width:min(92vw,520px);padding:46px 18px 30px;margin-top:6px}
.fl{position:absolute;width:var(--s);left:var(--x);top:var(--y);transform:translate(-50%,-50%) scale(0) rotate(-40deg);transition:transform 1.8s cubic-bezier(.2,.9,.3,1.2);z-index:0}
.fl.bud{transform:translate(-50%,-50%) scale(.28) rotate(0)}
.fl.open{transform:translate(-50%,-50%) scale(1) rotate(var(--r))}
.fl svg{width:100%;display:block}
.vine{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vine path{fill:none;stroke:#9bb08a;stroke-width:2;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 3s ease}
.vine.grow path{stroke-dashoffset:0}
#rname{position:relative;z-index:2;font-family:var(--serif);font-weight:600;font-size:clamp(3rem,15vw,5.6rem);line-height:1;opacity:0;filter:blur(12px);letter-spacing:.2em;background:linear-gradient(180deg,#7d2b4a,#c6a16b);-webkit-background-clip:text;background-clip:text;color:transparent;transition:all 2.4s ease}
#rname.show{opacity:1;filter:none;letter-spacing:.02em}
.rsub{position:relative;z-index:2;margin-top:10px;font-family:var(--script);font-size:clamp(1.8rem,8vw,2.6rem);color:var(--rg);opacity:0;transition:opacity 2s}
.rcomp{position:relative;z-index:2;margin:14px auto 0;max-width:26ch;font-family:var(--serif);font-style:italic;font-size:clamp(1.25rem,5vw,1.6rem);line-height:1.4;opacity:0;transition:opacity 2s}
.rsub.show,.rcomp.show{opacity:1}
/* S4 */
#s4{justify-content:flex-start;overflow-y:auto;overflow-x:hidden;background:radial-gradient(circle at 20% 10%,#fff 0,transparent 40%),repeating-linear-gradient(45deg,#fff7fa 0 6px,#fdeef3 6px 7px);-webkit-overflow-scrolling:touch}
#s4 h2{font-family:var(--script);font-weight:400;font-size:clamp(2.6rem,12vw,4rem);color:var(--rg);margin-top:10px}
#s4 .lead{font-family:var(--serif);font-style:italic;font-size:1.1rem;margin:2px 0 8px}
#cnt{font-size:.85rem;color:var(--rg);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 16px;width:min(100%,900px);padding:16px 4px 30px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:40px 28px}}
.pol{position:relative;background:#fff;padding:9px 9px 34px;box-shadow:0 12px 24px -10px rgba(120,50,80,.45),0 1px 2px rgba(0,0,0,.1);transform:rotate(var(--r));transition:transform .5s cubic-bezier(.2,.8,.3,1),box-shadow .5s,opacity .9s;opacity:0;cursor:pointer;text-align:center;touch-action:manipulation}
.pol.in{opacity:1}
.pol:hover{transform:rotate(0) translateY(-8px) scale(1.03);box-shadow:0 22px 34px -12px rgba(120,50,80,.55)}
.pol::before{content:"";position:absolute;top:-11px;left:50%;width:62px;height:20px;margin-left:-31px;background:linear-gradient(90deg,rgba(223,160,186,.85),rgba(243,196,213,.9));transform:rotate(calc(var(--r)*-2));box-shadow:0 2px 4px rgba(0,0,0,.12)}
.pol img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 30%;background:var(--pw)}
.pol span{position:absolute;left:0;right:0;bottom:5px;font-family:var(--script);font-size:1.15rem;color:var(--rg)}
.hh{position:absolute;right:-10px;bottom:-14px;width:46px;height:46px;font-size:1.5rem;color:var(--rs);filter:drop-shadow(0 2px 4px rgba(150,60,90,.4));animation:pulse 3s infinite;z-index:3}
.hh.found{color:#d4426f;animation:none}
#envbtn{margin:8px 0 40px;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transition:opacity 1.2s}
#envbtn.in{opacity:1}
#envbtn svg{width:110px;animation:float 4s infinite ease-in-out;filter:drop-shadow(0 8px 10px rgba(130,60,90,.35))}
#envbtn p{font-family:var(--serif);font-style:italic;font-size:1.15rem}
#lb,#msg{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(70,20,45,.55);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;padding:20px}
#lb.on,#msg.on{opacity:1;visibility:visible}
#lb .pf{background:#fff;padding:12px 12px 44px;max-width:min(94vw,640px);transform:scale(.8) rotate(var(--r,0));transition:transform .6s cubic-bezier(.2,.9,.3,1.1);position:relative}
#lb.on .pf{transform:scale(1) rotate(0)}
#lb img{display:block;max-width:100%;max-height:72vh;margin:auto}
#lb .pf span{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--script);font-size:1.5rem;color:var(--rg)}
#msg .card{max-width:340px;background:var(--iv);border:1px solid var(--gold);outline:6px solid var(--iv);outline-offset:-10px;border-radius:6px;padding:44px 30px;font-family:var(--serif);font-style:italic;font-size:1.5rem;line-height:1.4;text-align:center;transform:scale(.7) translateY(30px);transition:transform .7s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 30px 60px -20px #000}
#msg.on .card{transform:none}
#msg small{display:block;margin-top:20px;font-family:var(--sans);font-style:normal;font-size:.75rem;opacity:.5}
/* S5 */
#s5{background:linear-gradient(180deg,#f7cbdc,#fbe6ee);transition:background 2.5s,opacity 1.4s,visibility 1.4s}
#s5.floral{background:radial-gradient(circle at 15% 15%,#fff 0,transparent 35%),radial-gradient(circle at 90% 90%,#f3b3cc 0,transparent 45%),linear-gradient(180deg,#fdeaf1,#f6c6d9)}
.env{position:relative;width:min(84vw,340px);aspect-ratio:3/2;perspective:900px;animation:float 5s ease-in-out infinite;transition:transform 1.4s,opacity 1.4s}
.env.away{transform:translateY(60vh) scale(.8);opacity:0;animation:none}
.env>*{position:absolute}
.eb{inset:0;background:#e3a0ba;border-radius:6px;box-shadow:0 24px 40px -14px rgba(120,50,80,.55)}
.ef{inset:0;background:linear-gradient(160deg,#f8d3e1,#f1b5cc);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:6px}
.er{left:0;right:0;top:61%;height:9px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.efl{left:0;right:0;top:0;height:60%;background:linear-gradient(180deg,#ebaac3,#dd90b0);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.1s .5s cubic-bezier(.5,0,.2,1),z-index 0s .9s;z-index:3;backface-visibility:visible}
.env.open .efl{transform:rotateX(180deg);z-index:0}
.to{left:0;right:0;bottom:11%;font-family:var(--script);font-size:1.8rem;color:var(--bur);z-index:2}
.seal{left:50%;top:56%;width:58px;height:58px;margin:-29px;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#f0c3b3,#c68b8b 55%,#9d6070);box-shadow:0 4px 10px rgba(80,20,40,.5),inset 0 0 0 4px rgba(255,255,255,.2);font-family:var(--script);font-size:1.7rem;color:#fff3ec;animation:pulse 2.4s infinite}
.env.open .seal{animation:brk 1s forwards}@keyframes brk{30%{transform:scale(1.25) rotate(14deg)}100%{transform:translateY(40px) rotate(60deg) scale(.6);opacity:0}}
#letter{position:absolute;z-index:6;width:min(92vw,560px);max-height:80vh;overflow-y:auto;background:linear-gradient(#fffdf9,#fff6f0);border:1px solid var(--gold);outline:1px solid rgba(198,161,107,.5);outline-offset:-9px;border-radius:4px;padding:38px 28px 32px;text-align:left;box-shadow:0 30px 60px -20px rgba(100,30,60,.6);transform:translateY(55vh) scaleY(.15);transform-origin:top;opacity:0;visibility:hidden;transition:transform 2s cubic-bezier(.2,.8,.25,1),opacity 1s;font-family:var(--serif);font-size:clamp(1.15rem,4.4vw,1.35rem);line-height:1.65}
#letter.show{transform:none;opacity:1;visibility:visible}
#letter p{margin-bottom:1em;max-width:62ch}
#letter .sig{font-family:var(--script);font-size:1.7rem;line-height:1.35;color:var(--rg);margin-top:20px}
#letter .cta{display:block;margin:26px auto 0;opacity:.35;pointer-events:none}
#letter .cta.ready{opacity:1;pointer-events:auto}
#letter .cue{text-align:center;font-size:.8rem;font-family:var(--sans);opacity:.5}
/* S6 */
#s6{background:radial-gradient(circle at 50% 38%,#8d3560 0,#4a1535 45%,#1f0a1a 100%)}
#s6 .glow{position:absolute;width:120vmin;height:120vmin;border-radius:50%;background:radial-gradient(circle,rgba(230,190,120,.32),transparent 60%);animation:pulse 6s infinite;z-index:-1}
#s6 .nm{font-family:var(--script);font-size:clamp(3.6rem,19vw,7rem);background:linear-gradient(180deg,#fff2d8,#d9b574);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px}
#s6 h3{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,8vw,2.8rem);color:#ffe9f0;margin:8px 0}
#s6 h3.b{font-style:italic;color:#f3c4d5}
.cn{position:absolute;width:min(36vw,170px);opacity:.9;z-index:-1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.3s!important}.petal,.rise,.bf{display:none}}
</style></head><body>

const $=id=>document.getElementById(id),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a),T=(f,ms)=>setTimeout(f,ms);
const crownSVG=(k,id)=>{const g=k==='gold'?['#fff1b8','#d9a94a','#8a6020']:['#fde3da','#d9a0a0','#9a5f6e'];return `<svg viewBox="0 0 200 150" style="width:100%;display:block"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset=".45" stop-color="${g[1]}"/><stop offset=".7" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[2]}"/></linearGradient><radialGradient id="${id}r"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#ff7aa8"/><stop offset="1" stop-color="#9b1d4f"/></radialGradient></defs><path d="M22 118L10 44l46 40 44-66 44 66 46-40-12 74z" fill="url(#${id})" stroke="${g[2]}" stroke-width="1.5" stroke-linejoin="round"/><path d="M22 118L10 44l46 40" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><rect x="20" y="114" width="160" height="22" rx="5" fill="url(#${id})" stroke="${g[2]}" stroke-width="1.5"/><circle cx="100" cy="125" r="7" fill="url(#${id}r)"/><circle cx="55" cy="125" r="4.5" fill="#fff" fill-opacity=".85"/><circle cx="145" cy="125" r="4.5" fill="#fff" fill-opacity=".85"/><g fill="#fff"><circle cx="10" cy="42" r="6"/><circle cx="100" cy="14" r="7"/><circle cx="190" cy="42" r="6"/></g><path d="M40 108q30-22 60-4" stroke="#fff" stroke-opacity=".55" fill="none" stroke-width="3" stroke-linecap="round"/></svg>`};
const flower=(a,b)=>{let p='';for(let i=0;i<6;i++)p+=`<ellipse cx="50" cy="25" rx="14" ry="24" fill="${a}" stroke="${b}" stroke-opacity=".35" transform="rotate(${i*60} 50 50)" opacity=".93"/>`;return `<svg viewBox="0 0 100 100">${p}<circle cx="50" cy="50" r="10" fill="#e8c06f"/><circle cx="50" cy="50" r="4" fill="#fff6d8"/></svg>`};
const bfSVG=c=>`<svg viewBox="0 0 30 24"><ellipse cx="9" cy="8" rx="8" ry="7" fill="${c}" opacity=".85"/><ellipse cx="21" cy="8" rx="8" ry="7" fill="${c}" opacity=".85"/><ellipse cx="10" cy="17" rx="5" ry="5" fill="#fff" opacity=".7"/><ellipse cx="20" cy="17" rx="5" ry="5" fill="#fff" opacity=".7"/><rect x="14.4" y="3" width="1.2" height="17" fill="#7a3550"/></svg>`;
/* ---- starfield (one canvas) ---- */
const cv=$('fx'),cx=cv.getContext('2d');let S=[],dark=false,vis=true;
function size(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);S=Array.from({length:innerWidth<600?55:90},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:rnd(.6,2),p:rnd(0,6),s:rnd(.6,1.8)}))}
addEventListener('resize',size);size();
(function loop(t){if(vis){cx.clearRect(0,0,cv.width,cv.height);for(const s of S){const a=RM?.7:.35+.65*Math.abs(Math.sin(t/1000*s.s+s.p));cx.fillStyle=dark?`rgba(255,244,220,${a})`:`rgba(205,160,90,${a*.8})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill()}}requestAnimationFrame(loop)})(0);
document.addEventListener('visibilitychange',()=>vis=!document.hidden);

const L=$('layer');let timers=[];
function add(el,ms){L.appendChild(el);T(()=>el.remove(),ms)}
function petal(){const e=document.createElement('i');e.className='petal';const d=rnd(7,14);e.style.cssText=`left:${rnd(0,100)}vw;--dx:${rnd(-120,120)}px;--rot:${rnd(200,700)}deg;animation-duration:${d}s;width:${rnd(11,20)}px;height:${rnd(14,24)}px`;add(e,d*1000)}
function heart(){const e=document.createElement('i');e.className='rise';e.textContent='♥';const d=rnd(7,12);e.style.cssText=`left:${rnd(0,100)}vw;--dx:${rnd(-60,60)}px;font-size:${rnd(12,24)}px;animation-duration:${d}s;font-style:normal`;add(e,d*1000)}
function butterfly(){const e=document.createElement('i');e.className='bf';e.innerHTML=bfSVG(['#f7a8c8','#e9b6ff','#ffd2e3'][Math.floor(rnd(0,3))]);const d=rnd(9,14);e.style.cssText=`left:${rnd(5,90)}vw;--dx:${rnd(-120,120)}px;animation-duration:${d}s`;add(e,d*1000)}
function burst(x,y,n){for(let i=0;i<n;i++){const e=document.createElement('i');e.className='spark';const a=rnd(0,6.28),r=rnd(40,150);e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;add(e,1700)}}
function ambient(mix){stopAmb();const f=()=>{if(mix.p)petal();if(mix.h&&Math.random()<.5)heart();if(mix.b&&Math.random()<.18)butterfly()};timers.push(setInterval(f,RM?3000:mix.rate||650))}
function stopAmb(){timers.forEach(clearInterval);timers=[]}
/* ---- stage control ---- */
let cur=1,busy=false;
function go(n,dk){document.querySelectorAll('.stage').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on');cur=n;dark=!!dk;$('s'+n).scrollTop=0}
/* S1 */
$('t1').textContent=C.intro;$('t2').textContent=C.name;$('t3').textContent=C.subtitle;$('t4').textContent=C.opening;
ambient({p:1,rate:1400});
$('b1').onclick=()=>{if(busy)return;busy=true;go(2);T(()=>busy=false,1500)};
/* S2 */
$('crown').innerHTML=crownSVG('gold','cg');
let crowned=false;
function tapCrown(){if(crowned||busy)return;crowned=busy=true;const c=$('crown');$('hint').style.display='none';c.classList.add('glow');T(()=>$('wave').classList.add('go'),500);
T(()=>{c.classList.add('gone');$('s2').classList.add('garden');ambient({p:1,h:1,b:1,rate:230});for(let i=0;i<5;i++)T(()=>burst(rnd(30,innerWidth-30),rnd(60,innerHeight*.7),10),i*400);
const m=$('tmsg');m.textContent=C.transition;m.classList.add('show')},1500);
T(()=>{go(3);royal();busy=false},9500)}
$('crown').onclick=tapCrown;$('crown').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')tapCrown()};
/* S3 */
$('rcrown').innerHTML=crownSVG('rose','rg');$('rname').textContent=C.name;$('rsub').textContent=C.royalSub;$('rcomp').textContent=C.compliment;
const FL=[[6,12,60,-20],[30,-2,52,15],[70,-2,52,-10],[94,12,60,25],[2,52,50,10],[98,50,50,-15],[8,92,64,20],[34,104,50,-20],[66,104,50,10],[92,92,64,-25]];
FL.forEach((f,i)=>{const d=document.createElement('div');d.className='fl';d.style.cssText=`--x:${f[0]}%;--y:${f[1]}%;--s:${f[2]}px;--r:${f[3]}deg`;d.innerHTML=flower(i%3?'#f4a9c6':'#fbd3e2','#b0486e');$('bloom').prepend(d)});
function royal(){ambient({p:1,rate:900});const fl=[...document.querySelectorAll('.fl')];
T(()=>fl.forEach((f,i)=>T(()=>f.classList.add('bud'),i*150)),3200);
T(()=>fl.forEach((f,i)=>T(()=>{f.classList.remove('bud');f.classList.add('open')},i*280)),5200);
T(()=>$('vine').classList.add('grow'),6500);
T(()=>{$('rname').classList.add('show');const r=$('rname').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,26)},8800);
T(()=>$('rsub').classList.add('show'),11500);T(()=>$('rcomp').classList.add('show'),13000);T(()=>$('b3').hidden=false,15500)}
$('b3').onclick=()=>{go(4);ambient({p:0,rate:1e9});stopAmb();dark=false;observe()};
/* S4 */
let found=0;const seen=new Set();
$('cnt').textContent='3 little hearts are hidden here · 0 found';
const hearts={2:0,6:1,10:2};
PHOTOS.slice(0,12).concat(Array(Math.max(0,12-PHOTOS.length)).fill(null)).forEach((p,i)=>{const d=document.createElement('div');d.className='pol';d.style.setProperty('--r',(rnd(-4.5,4.5)).toFixed(1)+'deg');
d.innerHTML=(p&&p.src?`<img loading="lazy" decoding="async" alt="Memory ${i+1}" src="${p.src}">`:`<div style="aspect-ratio:4/5;background:var(--pw);display:grid;place-items:center;font-family:var(--script);font-size:1.6rem;color:var(--rg)">soon ♥</div>`)+`<span>${C.captions[i]||''}</span>`;
d.onclick=()=>{if(p&&p.src){$('lbi').src=p.src;$('lbc').textContent=C.captions[i]||'';$('lb').classList.add('on')}};
if(i in hearts){const k=hearts[i],h=document.createElement('button');h.className='hh';h.textContent='♥';h.setAttribute('aria-label','Hidden heart');h.onclick=e=>{e.stopPropagation();h.classList.add('found');if(!seen.has(k)){seen.add(k);found++;$('cnt').textContent=`3 little hearts are hidden here · ${found} found`}
$('mt').textContent=C.hidden[k];$('msg').classList.add('on');const r=h.getBoundingClientRect();burst(r.left+20,r.top+20,12)};d.appendChild(h)}
$('grid').appendChild(d)});
$('lb').onclick=()=>$('lb').classList.remove('on');$('msg').onclick=()=>$('msg').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape'){$('lb').classList.remove('on');$('msg').classList.remove('on')}});
$('envbtn').innerHTML=`<svg viewBox="0 0 120 80"><rect width="120" height="80" rx="5" fill="#e3a0ba"/><path d="M0 0L60 46 120 0V80H0z" fill="#f4c0d3"/><path d="M0 0L60 46 120 0z" fill="#dd90b0"/><circle cx="60" cy="44" r="10" fill="#c68b8b"/></svg><p>Open the final surprise</p>`;
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{root:$('s4'),threshold:.15});document.querySelectorAll('.pol,#envbtn').forEach(x=>io.observe(x))}
$('envbtn').onclick=()=>{if(busy)return;busy=true;go(5);dark=false;T(()=>busy=false,1500)};
/* S5 */
$('to').textContent='for '+C.name;
const LT=$('letter');LT.innerHTML=C.letter.map(p=>`<p>${p}</p>`).join('')+`<p class="sig">${C.signature}</p><div class="cue">scroll to read to the end</div><button class="cta" id="b5">Continue</button>`;
let opened=false;
function openEnv(){if(opened||busy)return;opened=busy=true;$('h5').style.display='none';const e=$('env');e.classList.add('open');
T(()=>{LT.classList.add('show');e.classList.add('away');$('s5').classList.add('floral');ambient({p:1,rate:500});for(let i=0;i<4;i++)T(()=>burst(rnd(40,innerWidth-40),rnd(60,innerHeight*.6),8),i*500)},1800);
T(()=>{busy=false;chk()},4200)}
$('env').onclick=openEnv;$('env').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openEnv()};
function chk(){if(LT.scrollTop+LT.clientHeight>=LT.scrollHeight-24)$('b5').classList.add('ready')}
LT.addEventListener('scroll',chk,{passive:true});
$('b5').onclick=()=>{if(busy)return;busy=true;go(6,true);stopAmb();finalAct();T(()=>busy=false,2000)};
/* S6 */
function finalAct(){$('f0').textContent=C.name;$('f1').textContent=C.finalA;$('f2').textContent=C.finalB;
$('cn1').innerHTML=`<div class="cn" style="left:-6%;top:-3%;transform:rotate(25deg)">${flower('#f4a9c6','#b0486e')}</div><div class="cn" style="right:-8%;bottom:-3%;transform:rotate(-15deg)">${flower('#fbd3e2','#b0486e')}</div>`;
$('cn2').innerHTML=`<div class="cn" style="right:-5%;top:2%;width:90px;transform:rotate(-30deg)">${flower('#e9a0c0','#7d2b4a')}</div><div class="cn" style="left:-4%;bottom:6%;width:100px;transform:rotate(18deg)">${flower('#fbd3e2','#7d2b4a')}</div>`;
ambient({p:1,h:0,rate:700});T(()=>{const r=$('f2').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,30)},6500)}
</script></body></html>
